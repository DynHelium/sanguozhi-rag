# 对维基文库 raw 文本的修正。raw/ 下文件保持下载原样，解析前按此表逐条套用。
# 每条：file 卷文件名；find 原文中必须恰好出现一次的片段；replace 替换成什么；reason 为什么改。
# find 找不到或出现多次时应报错——说明上游已改动，需要人工复核这条补丁。

- file: 卷44.wiki
  find: "太初不能勝也。」《世語》曰"
  replace: "太初不能勝也。」{{*|《世語》曰"
  reason: >-
    裴注缺开头 {{*|，只剩结尾 }}，导致括号不配对（scan 在位置 6117 报错）。
    注文起点定在「《世語》曰」前，依据是裴注引书惯例；待与其他版本核对。
